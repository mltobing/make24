[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Rewrite /api/ls/validate → Netlify function (keeps CORS transparent to browser)
[[redirects]]
  from   = "/api/ls/validate"
  to     = "/.netlify/functions/ls-validate"
  status = 200

[[redirects]]
  from   = "/api/app-events"
  to     = "/.netlify/functions/app-events"
  status = 200
